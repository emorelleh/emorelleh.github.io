<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header>
    <p>
      <a href="{{ '/' | relative_url }}">{{ site.name }}</a>
    </p>
    <p>{{ site.role }}<br>{{ site.affiliation }}</p>

    <nav aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}">Home</a> ·
      <a href="{{ '/profile/' | relative_url }}">Profile</a> ·
      <a href="{{ '/research/' | relative_url }}">Research</a> ·
      <a href="{{ '/publications/' | relative_url }}">Publications</a> ·
      <a href="{{ '/teaching/' | relative_url }}">Teaching</a> ·
      <a href="{{ '/contact/' | relative_url }}">Contact</a>
    </nav>
    <hr>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <hr>
    <p>© {{ 'now' | date: '%Y' }} {{ site.name }}. Personal academic website.</p>
  </footer>
</body>
</html>
